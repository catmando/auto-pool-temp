# Solid Queue recurring tasks. Runs inside `bin/jobs` (or Puma with SOLID_QUEUE_IN_PUMA=1).
default: &default
  scheduled_pool_checks:
    class: ScheduledChecksJob
    queue: default
    schedule: every hour at minute 5

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
