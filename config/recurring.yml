# Solid Queue recurring tasks. Production only, so a local bin/dev never sends
# duplicate alerts alongside the deployed app. (Run a check locally with the
# dashboard's buttons, or ScheduledChecksJob.perform_now in the console.)
production:
  scheduled_pool_checks:
    class: ScheduledChecksJob
    queue: default
    schedule: every hour at minute 5
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
